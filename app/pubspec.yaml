name: autonomous_shutter_app
description: Voice-controlled autonomous shutter mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  mqtt_client: ^10.3.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
  equatable: ^2.0.5
  flutter_tts: ^4.0.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
